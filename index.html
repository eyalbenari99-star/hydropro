<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>HydroPro — Loading…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0e0c;color:#e8eae6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#13201a;border:1px solid #1f3a2c;border-radius:14px;padding:30px;max-width:380px;width:100%;text-align:center;}
  h1{font-size:18px;margin-bottom:14px;color:#4caf50;}
  p{color:#aab2a8;font-size:13px;line-height:1.5;}
  .spinner{display:inline-block;width:24px;height:24px;border:3px solid #4caf50;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:14px 0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .manual{margin-top:18px;padding:12px;background:#1a2620;border-radius:8px;font-size:11px;color:#7c8a7e;line-height:1.6;}
  .manual a{color:#4caf50;font-weight:700;}
</style>
</head>
<body>
<div class="card">
  <h1>🌱 HydroPro</h1>
  <div class="spinner"></div>
  <p>Loading the latest version…</p>
  <div class="manual">
    If this page doesn't redirect within 5 seconds, click here:<br>
    <a id="manualLink" href="#">Open HydroPro →</a>
  </div>
</div>
<script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){try{await r.unregister();}catch(e){}}
    }
  }catch(e){}
  try{
    if('caches' in window){
      const names=await caches.keys();
      for(const n of names){try{await caches.delete(n);}catch(e){}}
    }
  }catch(e){}
  // Build target URL with cache-busting query param. Use a RELATIVE path so
  // it works the same way whether served from Netlify or opened as a local file.
  const target='app.html?_v='+Date.now();
  document.getElementById('manualLink').href=target;
  // Redirect with replace so back button doesn't return here
  setTimeout(()=>{window.location.replace(target);},250);
})();
</script>
</body>
</html>
