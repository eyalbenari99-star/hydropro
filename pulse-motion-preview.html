:root{--bg:#06110a;--mono:'SFMono-Regular',Menlo,Consolas,monospace;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px;max-width:1140px;}
.hnx-pulse-tile{border-radius:14px;padding:16px;background:linear-gradient(160deg,rgba(255,255,255,.025),rgba(0,0,0,.3));border:1.5px solid rgba(103,197,255,.25);min-height:160px;}
.hnx-pulse-tile[data-status="urgent"]{border-color:rgba(255,90,90,.6);} .hnx-pulse-tile[data-status="warn"]{border-color:rgba(255,172,66,.55);}

.pulse-dot{width:9px;height:9px;border-radius:50%;} .pulse-metric{font-size:40px;font-weight:800;margin:8px 0 2px;}
.pulse-spark{font-size:13px;letter-spacing:1px;opacity:.85;} .pulse-sub{font-size:10px;color:#7f9aab;margin-top:6px;}

      .hnx-pulse-tile{position:relative;overflow:hidden;}
      .hnx-pulse-tile > *:not(.p29-motif):not(.p29-glow):not(.p29-scrim){position:relative;z-index:3;}
      /* readability scrim so the big number stays crisp over colorful art */
      .p29-scrim{position:absolute;inset:0;z-index:2;pointer-events:none;
        background:linear-gradient(135deg,rgba(4,12,9,.72) 0%,rgba(4,12,9,.35) 38%,transparent 66%);}
      /* ambient colorful breathing glow */
      .p29-glow{position:absolute;z-index:0;right:-34px;bottom:-34px;width:180px;height:180px;border-radius:50%;
        pointer-events:none;opacity:.16;animation:p29breathe 5s ease-in-out infinite;
        background:radial-gradient(circle at center, var(--c1) 0%, var(--c2) 45%, transparent 70%);}
      @keyframes p29breathe{0%,100%{transform:scale(.82);opacity:.10;}50%{transform:scale(1.18);opacity:.24;}}
      .p29-motif{position:absolute;z-index:1;right:-10px;bottom:-12px;width:150px;height:150px;pointer-events:none;
        opacity:.85;filter:drop-shadow(0 0 4px var(--c1)) drop-shadow(0 0 16px var(--c2));
        animation:p29hue 17s linear infinite;}
      .hnx-pulse-tile[data-status="urgent"] .p29-motif{animation:p29alarm 1.6s ease-in-out infinite;}
      @keyframes p29hue{0%{filter:drop-shadow(0 0 4px var(--c1)) drop-shadow(0 0 16px var(--c2)) hue-rotate(0deg);}
                        100%{filter:drop-shadow(0 0 4px var(--c1)) drop-shadow(0 0 16px var(--c2)) hue-rotate(360deg);}}
      @keyframes p29alarm{0%,100%{filter:drop-shadow(0 0 5px #ff4444) drop-shadow(0 0 18px #ff2a2a);opacity:.85;}
                          50%{filter:drop-shadow(0 0 9px #ff6a6a) drop-shadow(0 0 26px #ff0000);opacity:1;}}
      .p29-motif svg{width:100%;height:100%;display:block;overflow:visible;}

      .hnx-pulse-tile::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
        background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.07) 50%,transparent 60%);
        background-size:260% 100%;animation:p29sweep 6s linear infinite;}
      @keyframes p29sweep{0%{background-position:130% 0;}100%{background-position:-130% 0;}}

      .p29-spin{animation:p29spin 5s linear infinite;}
      .p29-spin-slow{animation:p29spin 9s linear infinite;}
      .p29-spin-rev{animation:p29spinR 6.5s linear infinite;}
      @keyframes p29spin{to{transform:rotate(360deg);}}
      @keyframes p29spinR{to{transform:rotate(-360deg);}}
      .p29-orbit{transform-origin:60px 60px;animation:p29spin 15s linear infinite;}

      .p29-blip{transform-origin:center;animation:p29blip 2.2s ease-in-out infinite;}
      .p29-blip.b2{animation-delay:.7s;}.p29-blip.b3{animation-delay:1.4s;}
      @keyframes p29blip{0%,100%{opacity:.12;transform:scale(.5);}45%{opacity:1;transform:scale(1.35);}}

      .p29-twk.t2{animation-delay:.4s;}.p29-twk.t3{animation-delay:.9s;}.p29-twk.t4{animation-delay:1.3s;}.p29-twk.t5{animation-delay:.6s;}
      @keyframes p29twk{0%,100%{opacity:.1;transform:scale(.4);}50%{opacity:1;transform:scale(1);}}

      .p29-node{transform-origin:center;animation:p29node 2.4s ease-in-out infinite;}
      .p29-node.n2{animation-delay:.5s;}.p29-node.n3{animation-delay:1s;}.p29-node.n4{animation-delay:1.5s;}.p29-node.n5{animation-delay:.8s;}

      @keyframes p29dash{to{stroke-dashoffset:-16;}}

      .p29-bars rect:nth-child(2){animation-delay:.3s;}.p29-bars rect:nth-child(3){animation-delay:.6s;}

      .p29-evt.e2{animation-delay:.9s;}.p29-evt.e3{animation-delay:1.7s;}

      @keyframes p29conveyor{0%{transform:translateX(-26px);opacity:0;}12%{opacity:1;}86%{opacity:1;}100%{transform:translateX(124px);opacity:0;}}

      .p29-arc{transform-origin:30px 96px;animation:p29arc 2.5s ease-out infinite;}
      .p29-arc.a2{animation-delay:.6s;}.p29-arc.a3{animation-delay:1.2s;}
      @keyframes p29arc{0%{opacity:0;transform:scale(.4);}30%{opacity:1;}100%{opacity:0;transform:scale(1.45);}}
      .p29-beam{transform-origin:30px 96px;animation:p29beam 2.6s ease-in-out infinite;}
      @keyframes p29beam{0%,100%{transform:rotate(-34deg);opacity:.3;}50%{transform:rotate(22deg);opacity:1;}}

      .p29-wave{animation:p29wave 3.4s linear infinite;}
      .p29-wave.w2{animation-duration:5s;}
      @keyframes p29wave{to{transform:translateX(-60px);}}
      .p29-bubble{animation:p29bubble 3s ease-in infinite;}
      .p29-bubble.u2{animation-delay:1s;}.p29-bubble.u3{animation-delay:2s;}.p29-bubble.u4{animation-delay:.5s;}
      @keyframes p29bubble{0%{transform:translateY(8px);opacity:0;}25%{opacity:1;}100%{transform:translateY(-34px);opacity:0;}}

      @media (prefers-reduced-motion: reduce){ .p29-motif,.p29-motif *,.p29-glow,.hnx-pulse-tile::after{animation:none !important;} }

        <clipPath id="p29_wc"><rect x="6" y="40" width="108" height="74" rx="10"/></clipPath></defs>
      <g clip-path="url(#p29_wc)">
        <path class="p29-wave" d="M-60 70 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 L240 130 L-60 130 Z" fill="url(#p29_wf)"/>

        <circle class="p29-bubble" cx="38" cy="100" r="3" fill="#bfffff"/><circle class="p29-bubble u2" cx="62" cy="100" r="2.3" fill="#bfffff"/><circle class="p29-bubble u3" cx="84" cy="100" r="2.7" fill="#bfffff"/><circle class="p29-bubble u4" cx="50" cy="100" r="1.9" fill="#bfffff"/></g>

  };
function pick(name){
    const n=(name||'').toUpperCase();
    if(n.includes('OPEN CALL')) return MOTIFS.calls;
    if(n.includes('TASK')) return MOTIFS.tasks;
    if(n.includes('CALL MATRIX')||(n.includes('MATRIX')&&!n.includes('FER'))) return MOTIFS.matrix;
    if(n.includes('RECURRING')) return MOTIFS.recurring;
    if(n.includes('CALENDAR')) return MOTIFS.calendar;
    if(n.includes('REQUEST')) return MOTIFS.requests;
    if(n.includes('PART')) return MOTIFS.parts;
    if(n.includes('RFID')) return MOTIFS.rfid;
    if(n.includes('FER')||n.includes('GH &')) return MOTIFS.water;
    return MOTIFS.matrix;
  }
const TILES=[
 {icon:'📞',name:'OPEN CALLS',metric:'2',spark:'▂▁▃▄▂▆█',sub:'🔴 2 urgent',status:'urgent',accent:'#ff8a8a'},
 {icon:'📋',name:'TASK BOARD',metric:'0',spark:'▆▅▄▃▂▁▁',sub:'active tasks',status:'ok',accent:'#7CFF6B'},
 {icon:'📊',name:'CALL MATRIX',metric:'2',spark:'▃▁▆▄▃▁▇',sub:'🔥 IT-Other: 2',status:'warn',accent:'#22e1ff'},
 {icon:'🔁',name:'RECURRING',metric:'0%',spark:'▆▄█▃▅▁▆',sub:'0/1 today',status:'urgent',accent:'#ff8a8a'},
 {icon:'📅',name:'IT CALENDAR',metric:'0',spark:'▁▁▂▆▁▂▁',sub:'this week',status:'info',accent:'#22e1ff'},
 {icon:'📦',name:'ITEM REQUESTS',metric:'0',spark:'▁▃▅▆▂▃▁',sub:'pending approval',status:'ok',accent:'#ffd24b'},
 {icon:'🔩',name:'SPARE PARTS',metric:'—',spark:'▂▃▁▆▅▃▂',sub:'all stocked',status:'ok',accent:'#22e1ff'},
 {icon:'🆔',name:'RFID TAGS',metric:'0',spark:'▁▆▄▅▃▂▆',sub:'of 0 total',status:'ok',accent:'#7CFF6B'},
 {icon:'💧',name:'GH & FER MATRIX',metric:'0',spark:'▂▃▆▆▁▆▆',sub:'IT devices mapped',status:'info',accent:'#3df0ff'}
];
const dot=s=>s==='urgent'?'#ff5a5a':s==='warn'?'#ffac42':'#36c46a';
document.getElementById('grid').innerHTML=TILES.map(t=>{const m=pick(t.name);return `<div class="hnx-pulse-tile" data-status="${t.status}">
  <div class="p29-glow" style="--c1:${m.c1};--c2:${m.c2}"></div>
  <div class="p29-motif" style="--c1:${m.c1};--c2:${m.c2}">${m.svg}</div>
  <div class="p29-scrim"></div>
  <div class="pulse-head"><span class="pulse-icon">${t.icon}</span><span class="pulse-name">${t.name}</span><span class="pulse-dot" style="background:${dot(t.status)}"></span></div>
  <div class="pulse-metric" style="color:${t.accent}">${t.metric}</div>
  <div class="pulse-spark" style="color:${m.c1}">${t.spark}</div>
  <div class="pulse-sub">${t.sub}</div></div>`;}).join('');
</script></body></html>
