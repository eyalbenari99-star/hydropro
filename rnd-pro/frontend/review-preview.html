<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05090d" />
  <title>HydroNexis-AI R&D · Developer Review Preview</title>
  <link rel="stylesheet" href="./dist/style.css" />
  <style>html,body,#hnx-rnd-root{width:100%;height:100%;margin:0;background:#05090d}</style>
</head>
<body>
  <div id="hnx-rnd-root"></div>
  <script src="./dist/rnd-bundle.umd.cjs"></script>
  <script>
    const host = document.getElementById('hnx-rnd-root');
    if (!window.__initRNDv2) {
      host.innerHTML = '<p style="color:white;font:16px sans-serif;padding:24px">Build not found. Run the frontend production build first.</p>';
    } else {
      window.__rndController = window.__initRNDv2(host);
      window.__rndController.open();
    }
  </script>
</body>
</html>
