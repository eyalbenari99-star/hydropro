# Fly.io deployment config
# Run: fly launch (then edit) OR fly deploy --config deployment/fly.toml

app = "hnx-rnd"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "../backend/Dockerfile"

[env]
  PORT = "8001"
  CORS_ORIGINS = "https://your-app.pages.dev"

[[services]]
  internal_port = 8001
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.http_checks]]
    interval = "15s"
    grace_period = "10s"
    method = "get"
    path = "/api/rnd/health"
    protocol = "http"
    timeout = "5s"

[[mounts]]
  source = "hnx_data"
  destination = "/data"

# secrets to set: fly secrets set DATABASE_URL=... OPENAI_API_KEY=... R2_*=...
