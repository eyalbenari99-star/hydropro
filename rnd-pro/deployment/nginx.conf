# Front + backend behind a single nginx
upstream hnx_backend {
  server backend:8001;
}

server {
  listen 80;
  server_name _;

  # Frontend (compiled bundle)
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Backend proxy
  location /api/ {
    proxy_pass http://hnx_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # gzip / cache for assets
  gzip on;
  gzip_types text/plain application/javascript application/json text/css image/svg+xml;
  gzip_min_length 1024;
  location ~* \.(?:js|css|png|jpg|svg|woff2)$ {
    expires 7d;
    add_header Cache-Control public;
  }
}
